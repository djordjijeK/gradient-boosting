[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gbm"]

[project]
name = "gbm"
version = "1.0"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "scikit-learn"]
examples = ["scikit-learn", "xgboost", "lightgbm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"